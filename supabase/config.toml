# Supabase project configuration
# Ref: https://supabase.com/docs/guides/local-development/cli/config

[functions.ai-agent]
# verify_jwt MUST be false — this is an internal function invoked by whatsapp-webhook
# with explicit service role key auth. Setting true broke invocations silently when
# the deploy tool defaulted to true. Keep false always.
verify_jwt = false

[functions.whatsapp-webhook]
# verify_jwt false — receives unauthenticated requests from Meta Cloud API (HMAC-verified internally)
verify_jwt = false

[functions.improve-label-hint]
verify_jwt = false

[functions.send-wa-instant-scheduler]
# verify_jwt false — invocado internamente por pg_cron, no lleva JWT de usuario
verify_jwt = false

[functions.process-wa-automations]
# verify_jwt false — invocado por pg_cron, no lleva JWT de usuario
verify_jwt = false

[functions.wa-inbox-retry]
# verify_jwt false — invocado por pg_cron cada minuto. Se protege con
# requireInternal contra SUPABASE_SERVICE_ROLE_KEY.
verify_jwt = false

[functions.wa-health-check]
# verify_jwt false — invocado por pg_cron cada 5 min. Se protege con
# requireInternal contra SUPABASE_SERVICE_ROLE_KEY, igual que las demás.
verify_jwt = false

[functions.send-wa-campaign]
# Dos llamadores: el usuario del CRM (envío inmediato) y send-wa-instant-scheduler
# (envío programado y reanudación de lotes, con service role key). El key ya no es
# un JWT legacy, así que verify_jwt = true rechazaría al scheduler antes de entrar
# a la función. La autorización real la hace requireInternalOrUser + chequeo de user_id.
verify_jwt = false

[functions.send-wa-instant]
# Mismo caso que send-wa-campaign: lo llama el usuario del CRM y también el cron
# para retomar los lotes que quedaron pendientes.
verify_jwt = false

# ── verify_jwt = false + autenticación propia ────────────────────────────────
# Estas funciones ya estaban en false en el dashboard, pero no figuraban aquí: un
# deploy desde el CLI las habría puesto en true y roto la invocación interna.
# Todas validan internamente con requireInternal/requireInternalOrUser
# (_shared/internal-auth.ts) contra SUPABASE_SERVICE_ROLE_KEY, que es lo que
# realmente las protege — verify_jwt no sirve aquí porque la anon key también es
# un JWT válido.

[functions.analyze-sales-pattern]
# Interna (ai-agent, confirm-ai-sale) — gasta tokens de Anthropic
verify_jwt = false

[functions.send-reminders]
# Interna (cron-queue-reminders, crm-calendar-book, crm-form-public, ai-agent)
verify_jwt = false

[functions.cron-queue-reminders]
# Interna (pg_cron cada 5 min)
verify_jwt = false

[functions.send-renewal-reminders]
# Interna (pg_cron diario)
verify_jwt = false

[functions.update-fx-rate]
# Interna (pg_cron diario)
verify_jwt = false

[functions.notify-stock-alert]
# Interna (trigger trigger_notify_stock_alert)
verify_jwt = false

[functions.notify-course-url-change]
# Interna — recorre todos los tenants
verify_jwt = false

[functions.sync-to-google]
# Interna (crm-calendar-book, ai-agent) o usuario del CRM con ownership de la cita
verify_jwt = false

[functions.sync-google-calendar]
# Webhook de Google (autenticado por google_channel_id), pg_cron, o usuario dueño
verify_jwt = false

[functions.send-course-invitation]
# Interna o usuario dueño del curso
verify_jwt = false

# ── Acceso de alumnos a cursos (sin cuenta) ─────────────────────────────────
# El alumno no está autenticado en Supabase: su identidad se prueba con el código
# de 6 dígitos que recibe por email, y luego con el token de sesión opaco que se
# valida contra crm_course_sessions. El navegador no manda apikey ni Authorization,
# así que verify_jwt = true las dejaría inservibles.

[functions.request-course-access]
# Pública — rate limit por IP y por email+curso dentro de la función
verify_jwt = false

[functions.verify-course-otp]
# Pública — canjea el código por sesión; rate limit por IP + contador por código
verify_jwt = false

[functions.get-course-content]
# Pública — autoriza con el token de sesión, no con JWT de Supabase
verify_jwt = false

[functions.course-logout]
# Pública — revoca la sesión del propio token que se presenta
verify_jwt = false

[functions.notify-sale]
# Interna (ai-agent) — valida x-internal-key contra el service role key
verify_jwt = false

[functions.send-support-email]
# verify_jwt = false porque la anon key también es un JWT válido y no distinguiría
# nada. La autorización real es interna: exige un JWT de usuario resuelto con
# auth.getUser() y comprueba que sea el dueño del ticket (o el admin, para el
# trigger 'admin_reply').
verify_jwt = false

# ── Widgets públicos embebibles ─────────────────────────────────────────────
# Los visitantes anónimos no mandan Authorization, solo apikey. Con verify_jwt =
# true responden UNAUTHORIZED_NO_AUTH_HEADER y el formulario/calendario queda en
# blanco. Ambas validan y limitan por IP internamente (check_rate_limit).

[functions.crm-form-public]
verify_jwt = false

[functions.crm-calendar-book]
verify_jwt = false
